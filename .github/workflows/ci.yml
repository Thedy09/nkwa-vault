name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nkwa
          POSTGRES_PASSWORD: nkwa_test
          POSTGRES_DB: nkwa_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nkwa -d nkwa_vault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nkwa:nkwa_test@localhost:5432/nkwa_vault_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      NODE_ENV: test
      REDIS_ENABLED: false
      AUTH_DEMO_MODE: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: cd backend && npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Backend tests
        run: cd backend && npm test

      - name: Frontend tests
        run: cd frontend && npm run test:coverage

      - name: Build frontend
        run: npm run build
